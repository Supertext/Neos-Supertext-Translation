# Neos.Demo ships English (US, with English UK as a variant) and German.
# The demo adds French and Italian, empty, as targets for Supertext.
Neos:
  # Railway terminates TLS at its proxy and forwards plain HTTP.
  Flow:
    http:
      trustedProxies:
        proxies: '*'
  Neos:
    sites:
      '*':
        contentDimensions:
          resolver:
            options:
              segments:
                -
                  dimensionIdentifier: language
                  dimensionValueMapping:
                    fr: fr
                    it: it
  ContentRepositoryRegistry:
    contentRepositories:
      default:
        contentDimensions:
          language:
            values:
              fr:
                label: 'Français'
              it:
                label: 'Italiano'

# Language mapping: chosen under Administration → Supertext (the entrypoint's
# demo:ensurelanguages preselects de-CH, fr-CH and it-CH, formal, on the first start).
# en_UK is set here to show the Settings.yaml override (read-only in the module); en_US is a
# Supertext code itself.
Supertext:
  NeosTranslation:
    languages:
      en_UK: { code: 'en-GB' }
