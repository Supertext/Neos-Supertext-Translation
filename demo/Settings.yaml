# Demo container: database from the environment (Railway service variables).
Neos:
  Flow:
    persistence:
      backendOptions:
        driver: pdo_mysql
        charset: utf8mb4
        host: '%env:DB_HOST%'
        port: '%env:DB_PORT%'
        dbname: '%env:DB_NAME%'
        user: '%env:DB_USER%'
        password: '%env:DB_PASSWORD%'
