# Demo container: database from the environment (Railway service variables).
Neos:
  Flow:
    persistence:
      backendOptions:
        driver: pdo_mysql
        charset: utf8mb4
        host: '%env:DB_HOST%'
        port: '%env:DB_PORT%'
        dbname: '%env:DB_NAME%'
        user: '%env:DB_USER%'
        password: '%env:DB_PASSWORD%'
    core:
      # The PHP image has no php.ini; since Flow 9.2 sub-requests (./flow
      # commands started by Flow) fail with "Could not resolve ini file" unless
      # they are told not to pass one.
      subRequestPhpIniPathAndFilename: false
