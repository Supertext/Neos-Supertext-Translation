name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint
        run: find . -name '*.php' -not -path './vendor/*' -not -path './Packages/*' -print0 | xargs -0 -n1 php -l
      - name: HTML round-trip test
        run: php Tests/HtmlDocumentTest.php
      - name: Version helper test
        run: php Tests/PackageVersionTest.php
      - name: Demo entrypoint syntax
        run: sh -n demo/entrypoint.sh

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: intl, gd, zip, exif, pdo_mysql
          tools: phpstan:2.1
          coverage: none
      # Neos in the versions the demo locks. The package itself only needs its
      # composer.json there: PHPStan reads Classes/ from the repo root.
      - name: Install Neos (demo/composer.lock)
        run: |
          mkdir -p demo/DistributionPackages/Supertext.NeosTranslation
          cp composer.json demo/DistributionPackages/Supertext.NeosTranslation/
          composer install --working-dir=demo --no-dev --no-scripts --no-interaction --no-progress
      - name: PHPStan
        run: phpstan analyse --no-progress --error-format=github --autoload-file=demo/Packages/Libraries/autoload.php
