Supertext:
  NeosTranslation:
    # Translate automatically when a node is created in another language
    # (Neos UI "Create" / "Create and copy" in a new language, or supertext:translate).
    enabled: true

    # Supertext API key. The SUPERTEXT_API_KEY environment variable takes precedence.
    # Supertext shows the key as "Supertext-Auth-Key <key>"; either form works.
    # No Supertext account yet? Create one (or log in): https://www.supertext.com/person/en/account/signin
    # Generate the key at supertext.com > Integrations > API (requires the Admin role):
    # https://www.supertext.com/en/integrations/api
    apiKey: ''

    # API base URL. SUPERTEXT_API_ENDPOINT takes precedence.
    # Live: https://api.supertext.com/v1/  (also api.staging… / api.testing…)
    endpoint: 'https://api.supertext.com/v1/'

    # Seconds between status checks / maximum seconds to wait for one document.
    pollInterval: 2
    pollTimeout: 240

    # Name of the language dimension in the content repository.
    languageDimension: 'language'

    # Language mapping: which Supertext code each value of the language dimension is
    # translated with. Normally chosen under Administration → Supertext (one combo box per
    # language, stored in the persistent cache Supertext_NeosTranslation_State). Entries here
    # override that choice for the languages they name (for automated setups; the module
    # shows them read-only). Without either, the Supertext SDK decides: a value that is a
    # Supertext code apart from case and "_"/"-" ("en_US", "es") is used as it is; a value
    # with an obvious default gets it ("de" -> "de-DE", "en" -> "en-US", "fr" -> "fr-FR",
    # "it" -> "it-IT", "pt" -> "pt-PT", "zh" -> "zh-Hans", "es_ES" -> "es"); any other
    # ("en_UK", "en_IE", "gsw") stops with "has no Supertext language yet" until it is mapped.
    # See docs/INSTALLATION.md -> Languages.
    #   code:       Supertext code for this language, e.g. "de-CH" (used as source too: "de")
    #   politeness: "more" (formal: Sie/vous), "less" (informal: du/tu) or "default";
    #               only for targets that offer it (supertext:check warns otherwise)
    #   enabled:    false to never translate into this language (Settings.yaml only)
    languages: []
    #  de:
    #    code: 'de-CH'
    #    politeness: 'more'
    #  en_UK:
    #    code: 'en-GB'

    # Send version information to Supertext: sends the site URL and the versions of this
    # plugin, Neos and PHP to Supertext after an update and when the API key changes, so
    # Supertext support can see which version you run. No content, no API key and no
    # personal data are sent. The SUPERTEXT_VERSION_REPORTS environment variable (0/1)
    # takes precedence. While on, the site answers GET /supertext/ping (see
    # docs/INSTALLATION.md -> Version information).
    versionReports: true

    # Which string properties are translated, by Inspector editor. Inline-editable
    # properties are always translated as HTML. Per property you can override with
    #   properties.<name>.options.supertext.translate: true|false
    editors:
      plainText:
        - 'Neos.Neos/Inspector/Editors/TextFieldEditor'
        - 'Neos.Neos/Inspector/Editors/TextAreaEditor'
      richText:
        - 'Neos.Neos/Inspector/Editors/RichTextEditor'

    # Properties never translated (regenerated or technical).
    excludedProperties:
      - 'uriPathSegment'

Neos:
  Neos:
    modules:
      management:
        submodules:
          # Management → Supertext: Export for translation / Import translation
          # (access: Policy.yaml, Supertext.NeosTranslation:Module.TranslationFiles).
          supertext:
            label: 'Supertext.NeosTranslation:Main:module.label'
            description: 'Supertext.NeosTranslation:Main:module.description'
            controller: 'Supertext\NeosTranslation\Controller\TranslationFilesController'
            icon: 'fas fa-language'
            mainStylesheet: 'Lite'
            privilegeTarget: 'Supertext.NeosTranslation:Module.TranslationFiles'
      administration:
        submodules:
          # Administration → Supertext: language mapping, one combo box per language
          # (access: Policy.yaml, Supertext.NeosTranslation:Module.LanguageMapping).
          supertext:
            label: 'Supertext.NeosTranslation:Main:mapping.module.label'
            description: 'Supertext.NeosTranslation:Main:mapping.module.description'
            controller: 'Supertext\NeosTranslation\Controller\LanguageMappingController'
            icon: 'fas fa-language'
            mainStylesheet: 'Lite'
            privilegeTarget: 'Supertext.NeosTranslation:Module.LanguageMapping'

  ContentRepositoryRegistry:
    presets:
      'default':
        commandHooks:
          'Supertext.NeosTranslation:CollectTranslations':
            factoryObjectName: 'Supertext\NeosTranslation\ContentRepository\TranslationCommandHookFactory'

  Flow:
    object:
      # Object management for the package's own classes only: the bundled Supertext SDK
      # (lib/supertext-sdk, Supertext\NeosTranslation\Sdk), the bundled Supertext Plugin Health
      # (lib/supertext-plugin-health, Supertext\NeosTranslation\PluginHealth),
      # Reporting\Reporting, Reporting\PluginHealthTransport and Files\ (translation files) are plain PHP. Flow would
      # otherwise proxy them, and the proxies break named constructor arguments.
      includeClasses:
        'Supertext.NeosTranslation': ['^Supertext\\NeosTranslation\\(?!Sdk\\|PluginHealth\\|Files\\|Reporting\\Reporting$|Reporting\\PluginHealthTransport$)']
    http:
      middlewares:
        # Public GET /supertext/ping for the Supertext Commando Center (no session, no
        # page cache); 404 while version reports are off.
        'Supertext.NeosTranslation:Ping':
          position: 'before session'
          middleware: 'Supertext\NeosTranslation\Http\PingMiddleware'
        # Sends everything collected during the request to Supertext once the
        # request has been handled: one document per target language.
        'Supertext.NeosTranslation:TranslatePending':
          position: 'before dispatch'
          middleware: 'Supertext\NeosTranslation\Http\TranslatePendingMiddleware'
